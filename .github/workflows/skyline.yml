name: Skyline

on:
  schedule:
    - cron: "30 19 * * *" # 01:00 in India, after the day has closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Draw the skyline
        run: python3 .github/scripts/skyline.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A fresh single-commit branch each day, so main's history stays free of bot commits.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet -m "Draw skyline"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
